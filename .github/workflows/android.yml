name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: development-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 7
