name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.2.0
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v6.4.1
    - name: Set up Android CLI
      run: |
        mkdir -p "$RUNNER_TEMP/android-cli"
        curl --fail --silent --show-error --location --retry 3 https://dl.google.com/android/cli/latest/linux_x86_64/android --output "$RUNNER_TEMP/android-cli/android"
        chmod +x "$RUNNER_TEMP/android-cli/android"
        echo "$RUNNER_TEMP/android-cli" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/android-cli/android" --no-metrics --version
    - name: Install Android SDK packages
      run: android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms/android-35' 'build-tools/36.0.0'
    - name: Test, lint, and build
      run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --console=plain
    - name: Upload installable development APK
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: herdr-development-apk
        BUILD_PATHS: app/build/outputs/apk/debug/*.apk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - name: Upload unsigned release APK
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: herdr-release-unsigned
        BUILD_PATHS: app/build/outputs/apk/release/*-unsigned.apk
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - name: Upload test and lint reports
      if: (always()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: android-test-reports
        BUILD_PATHS: |
          app/build/reports/tests/testDebugUnitTest/
          app/build/reports/lint-results-debug.*
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: warn
    permissions:
      contents: write

