plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing stays outside the checkout; never put keys or passwords in Git.
def releaseSigningPath = providers.environmentVariable('HERDR_SIGNING_PROPERTIES').orNull
def releaseSigning = new Properties()
if (releaseSigningPath != null) {
    def signingFile = file(releaseSigningPath)
    if (!signingFile.isFile()) throw new GradleException('HERDR_SIGNING_PROPERTIES must point to a private properties file')
    signingFile.withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each {
        if (!releaseSigning.getProperty(it)) throw new GradleException("Missing release signing field: $it")
    }
}

android {
    namespace 'io.github.razvanmanolache.herdronthego'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.razvanmanolache.herdronthego'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.2.2'
        testInstrumentationRunner 'io.github.razvanmanolache.herdronthego.IsolatedTestRunner'
    }

    signingConfigs {
        if (releaseSigningPath != null) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningPath != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.github.mwiede:jsch:0.2.21'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
